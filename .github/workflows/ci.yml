# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [content-published] # content 仓推送 → validate-redirects 通过后触发(spec 8.7 的 ECS 版)

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write # temp diag
    steps:
      - uses: actions/checkout@v4
        with:
          # 关键:持久化的 URL 作用域 extraheader(主仓 GITHUB_TOKEN)会覆盖
          # pull-content 用 CONTENT_GITHUB_TOKEN 拉 content 仓的认证(spec 7.12)
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # >=22.12 约束下使用 24 LTS 对齐本地验证环境
          cache: pnpm
      - uses: lycheeverse/lychee-action@v2
        with:
          install: true
          args: '--version' # 仅安装二进制;真正的死链检查在 pnpm build 的 postbuild 链里执行(check:links,对 dist/ 离线扫描)
      - run: pnpm install --frozen-lockfile

      - name: Code checks (no secret)
        run: pnpm check && pnpm lint && pnpm test

      - name: Build (trusted context)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          pnpm build 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
        env:
          CONTENT_REPO: ${{ secrets.CONTENT_REPO || 'NaloxoneE-Lab/object920-content' }}
          CONTENT_GITHUB_TOKEN: ${{ secrets.CONTENT_GITHUB_TOKEN }}
          FORCE_CONTENT_SYNC: 'true'
          PUBLIC_SEARCH_ENABLED: 'true'
          PUBLIC_SEARCH_PROVIDER: 'pagefind'
          PUBLIC_SITE_URL: 'https://example.com'
          PUBLIC_ASSETS_USER: 'NaloxoneE-Lab'
          PUBLIC_ASSETS_REPO: 'object920-assets'

      - name: TEMP upload diag log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -50 /tmp/build.log > diag.log 2>/dev/null || echo missing > diag.log
          TAG="diag-$GITHUB_RUN_ID"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" >/dev/null || true
          upload_url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | python3 -c "import json,sys; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" --data-binary @diag.log "$upload_url?name=diag.log" >/dev/null

      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: dist-preview

  # ECS 部署(SSH 直推):main push(代码更新)/ repository_dispatch(内容更新)/ 手动触发
  # CI 把 dist 打包 scp 到 ECS,ECS 端 rsync --delete 原子换装 + nginx conf 安装 + reload。
  # 前提:阿里云安全组放行 22(0.0.0.0/0);仓库 secrets:ECS_HOST / ECS_SSH_KEY(见回退说明)
  deploy-ecs:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check deploy secrets configured
        id: guard
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          if [ -n "$ECS_HOST" ] && [ -n "$ECS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ECS deploy secrets not configured — skipping deploy"
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.enabled == 'true'
      - name: Build with deploy site URL
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm build
        env:
          CONTENT_REPO: ${{ secrets.CONTENT_REPO || 'NaloxoneE-Lab/object920-content' }}
          CONTENT_GITHUB_TOKEN: ${{ secrets.CONTENT_GITHUB_TOKEN }}
          FORCE_CONTENT_SYNC: 'true'
          PUBLIC_SEARCH_ENABLED: 'true'
          PUBLIC_SEARCH_PROVIDER: 'pagefind'
          PUBLIC_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || 'http://47.114.43.241' }}
          PUBLIC_ASSETS_USER: 'NaloxoneE-Lab'
          PUBLIC_ASSETS_REPO: 'object920-assets'
      - name: Generate nginx configs
        if: steps.guard.outputs.enabled == 'true'
        run: |
          pnpm run generate:redirects
          pnpm run generate:deploy-config -- --platform=nginx
        env:
          DEPLOY_PLATFORM: nginx
          PUBLIC_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || 'http://47.114.43.241' }}
      - name: Rsync to ECS
        if: steps.guard.outputs.enabled == 'true'
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER || 'root' }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$ECS_SSH_KEY" > /tmp/deploy_key
          # 诊断:ECS_HOST 与当前公网 IP 不符时(实例重启后非 EIP 公网 IP 会变),
          # rsync 会"成功"写进另一台机器/失效地址;只报布尔与长度,不泄露 Secret 值
          if [ "$ECS_HOST" = "47.114.43.241" ]; then
            echo "::notice::ECS_HOST matches the public IP 47.114.43.241"
          else
            echo "::warning::ECS_HOST does NOT match 47.114.43.241 (len=${#ECS_HOST}) — update the repo secret if the instance IP changed"
          fi
          # GitHub(海外 runner)→ 阿里云的 SSH 长连接极不稳(rsync 逐文件往返会被拖死),
          # 改为:本地打 tar 包 → 单连接 scp(压缩后 ~2MB,失败重传代价小)→ ECS 本地
          # rsync --delete 原子换装;ConnectTimeout 让僵死连接 15s 内判死
          SSH_OPTS="-i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          tar -C dist -czf /tmp/object920-dist.tgz .
          # 注意:if 条件为假且无 else 分支时 $? 恒为 0(POSIX),真实退出码必须在 else 内捕获,
          # 否则失败会被吞成 return 0、部署假成功(0.197.x 历史教训)
          retry() {
            n=1
            while :; do
              if out=$("$@" 2>&1); then
                LAST_OUT="$out"
                return 0
              else
                rc=$?
              fi
              if [ "$n" -ge 3 ]; then
                echo "::error::gave up after $n attempts (last exit $rc): ${out:0:400}"
                return "$rc"
              fi
              echo "::warning::attempt $n failed (exit $rc): ${out:0:300}"
              n=$((n + 1))
              sleep 15
            done
          }
          retry scp $SSH_OPTS /tmp/object920-dist.tgz $ECS_USER@$ECS_HOST:/tmp/object920-dist.tgz || exit $?
          retry ssh $SSH_OPTS $ECS_USER@$ECS_HOST '
            set -e
            mkdir -p /var/www/object920-incoming
            tar -xzf /tmp/object920-dist.tgz -C /var/www/object920-incoming
            rsync -a --delete /var/www/object920-incoming/ /var/www/object920/
            cp /var/www/object920/nginx/object920.conf /etc/nginx/sites-available/object920
            cp /var/www/object920/nginx/object920-redirects.conf /etc/nginx/conf.d/object920-redirects.conf
            rm -rf /var/www/object920-incoming /tmp/object920-dist.tgz
            nginx -t && systemctl reload nginx
            echo REMOTE_DEPLOY_OK
          ' || exit $?
          echo "::notice::remote output: ${LAST_OUT:0:400}"
          rm -f /tmp/deploy_key /tmp/object920-dist.tgz
