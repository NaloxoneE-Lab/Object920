# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [content-published] # content 仓推送 → validate-redirects 通过后触发(spec 8.7 的 ECS 版)

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 关键:持久化的 URL 作用域 extraheader(主仓 GITHUB_TOKEN)会覆盖
          # pull-content 用 CONTENT_GITHUB_TOKEN 拉 content 仓的认证(spec 7.12)
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # >=22.12 约束下使用 24 LTS 对齐本地验证环境
          cache: pnpm
      - uses: lycheeverse/lychee-action@v2
        with:
          install: true
          args: '--version' # 仅安装二进制;真正的死链检查在 pnpm build 的 postbuild 链里执行(check:links,对 dist/ 离线扫描)
      - run: pnpm install --frozen-lockfile

      - name: Code checks (no secret)
        run: pnpm check && pnpm lint && pnpm test

      - name: Build (trusted context)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          pnpm build 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
        env:
          CONTENT_REPO: ${{ secrets.CONTENT_REPO || 'NaloxoneE-Lab/object920-content' }}
          CONTENT_GITHUB_TOKEN: ${{ secrets.CONTENT_GITHUB_TOKEN }}
          FORCE_CONTENT_SYNC: 'true'
          PUBLIC_SEARCH_ENABLED: 'true'
          PUBLIC_SEARCH_PROVIDER: 'pagefind'
          PUBLIC_MUSIC_ENABLED: 'true'
          PUBLIC_SITE_URL: 'https://example.com'
          PUBLIC_ASSETS_USER: 'NaloxoneE-Lab'
          PUBLIC_ASSETS_REPO: 'object920-assets'

      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: dist-preview

  # Cloudflare Workers 部署触发(2026-10 起替代 ECS rsync 直推,回滚可从 git 历史恢复 deploy-ecs):
  # 仅内容更新(repository_dispatch)/ 手动触发时调用 Deploy Hook 让 Cloudflare 重新构建;
  # push 到 main 不触发——Workers Builds 已监听 main,再触发会双重构建。
  # Hook URL:Worker → Settings → Builds → Deploy hooks 创建,存为仓库 secret CF_DEPLOY_HOOK_URL。
  deploy-cloudflare:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy hook secret configured
        id: guard
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$CF_DEPLOY_HOOK_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_DEPLOY_HOOK_URL not configured — skipping deploy hook"
          fi
      - name: Trigger Cloudflare deploy hook
        if: steps.guard.outputs.enabled == 'true'
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          # hook 对同 commit 幂等(Cloudflare 去重),失败重试代价小;
          # if 条件为假且无 else 时 $? 恒为 0(POSIX),真实退出码必须在 else 内捕获
          retry() {
            n=1
            while :; do
              if out=$(curl -fsS -X POST "$CF_DEPLOY_HOOK_URL" 2>&1); then
                echo "::notice::deploy hook accepted: ${out:0:200}"
                return 0
              else
                rc=$?
              fi
              if [ "$n" -ge 3 ]; then
                echo "::error::gave up after $n attempts (last exit $rc): ${out:0:400}"
                return "$rc"
              fi
              echo "::warning::attempt $n failed (exit $rc): ${out:0:300}"
              n=$((n + 1))
              sleep 15
            done
          }
          retry
