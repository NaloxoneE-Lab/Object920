# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [content-published] # content 仓推送 → validate-redirects 通过后触发(spec 8.7 的 ECS 版)

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write # temp diag
    steps:
      - uses: actions/checkout@v4
        with:
          # 关键:持久化的 URL 作用域 extraheader(主仓 GITHUB_TOKEN)会覆盖
          # pull-content 用 CONTENT_GITHUB_TOKEN 拉 content 仓的认证(spec 7.12)
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # >=22.12 约束下使用 24 LTS 对齐本地验证环境
          cache: pnpm
      - uses: lycheeverse/lychee-action@v2
        with:
          install: true
          args: '--version' # 仅安装二进制;真正的死链检查在 pnpm build 的 postbuild 链里执行(check:links,对 dist/ 离线扫描)
      - run: pnpm install --frozen-lockfile

      - name: Code checks (no secret)
        run: pnpm check && pnpm lint && pnpm test

      - name: Build (trusted context)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          pnpm build 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
        env:
          CONTENT_REPO: ${{ secrets.CONTENT_REPO || 'NaloxoneE-Lab/object920-content' }}
          CONTENT_GITHUB_TOKEN: ${{ secrets.CONTENT_GITHUB_TOKEN }}
          FORCE_CONTENT_SYNC: 'true'
          PUBLIC_SEARCH_ENABLED: 'true'
          PUBLIC_SEARCH_PROVIDER: 'pagefind'
          PUBLIC_SITE_URL: 'https://example.com'
          PUBLIC_ASSETS_USER: 'NaloxoneE-Lab'
          PUBLIC_ASSETS_REPO: 'object920-assets'

      - name: TEMP upload diag log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -50 /tmp/build.log > diag.log 2>/dev/null || echo missing > diag.log
          TAG="diag-$GITHUB_RUN_ID"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" >/dev/null || true
          upload_url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | python3 -c "import json,sys; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" --data-binary @diag.log "$upload_url?name=diag.log" >/dev/null

      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: dist-preview

  # ECS 部署(CF relay 方案):main push(代码更新)/ repository_dispatch(内容更新)/ 手动触发
  # CI 把 dist 上传到 Cloudflare Worker(R2),ECS 轮询器(deploy/cf-relay/ecs/)每分钟拉取换装。
  # 不依赖入站 SSH(海外 runner → 阿里云 22 端口不可达,实测)。secrets 未配置时自动跳过。
  deploy-ecs:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check deploy secrets configured
        id: guard
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_URL" ] && [ -n "$DEPLOY_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_URL/DEPLOY_TOKEN not configured — skipping deploy (setup: deploy/cf-relay/README.md)"
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.enabled == 'true'
      - name: Build with deploy site URL
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm build
        env:
          CONTENT_REPO: ${{ secrets.CONTENT_REPO || 'NaloxoneE-Lab/object920-content' }}
          CONTENT_GITHUB_TOKEN: ${{ secrets.CONTENT_GITHUB_TOKEN }}
          FORCE_CONTENT_SYNC: 'true'
          PUBLIC_SEARCH_ENABLED: 'true'
          PUBLIC_SEARCH_PROVIDER: 'pagefind'
          PUBLIC_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || 'http://47.114.43.241' }}
          PUBLIC_ASSETS_USER: 'NaloxoneE-Lab'
          PUBLIC_ASSETS_REPO: 'object920-assets'
      - name: Generate nginx configs
        if: steps.guard.outputs.enabled == 'true'
        run: |
          pnpm run generate:redirects
          pnpm run generate:deploy-config -- --platform=nginx
        env:
          DEPLOY_PLATFORM: nginx
          PUBLIC_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || 'http://47.114.43.241' }}
      - name: Upload dist to Cloudflare relay
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          tar -C dist -czf /tmp/object920-dist.tgz .
          # 注意:if 条件为假且无 else 分支时 $? 恒为 0(POSIX),真实退出码必须在 else 内捕获
          retry() {
            n=1
            while :; do
              if out=$("$@" 2>&1); then
                return 0
              else
                rc=$?
              fi
              if [ "$n" -ge 3 ]; then
                echo "::error::gave up after $n attempts (last exit $rc): ${out:0:300}"
                return "$rc"
              fi
              echo "::warning::attempt $n failed (exit $rc): ${out:0:200}"
              n=$((n + 1))
              sleep 15
            done
          }
          # 顺序固定:先载荷后版本标记;轮询端以 version 为触发信号
          retry curl -fsS -m 300 -X PUT --data-binary @/tmp/object920-dist.tgz \
            -H "Authorization: Bearer $DEPLOY_TOKEN" -H "Content-Type: application/octet-stream" \
            "$DEPLOY_URL/dist.tgz" || exit $?
          retry curl -fsS -m 60 -X PUT --data-binary "$GITHUB_SHA-$(date -u +%Y%m%dT%H%M%SZ)" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" -H "Content-Type: text/plain" \
            "$DEPLOY_URL/version" || exit $?
          echo "::notice::dist uploaded; ECS poller picks it up within ~1 min"
